<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Daftar - FreshFlower</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="assets/css/style.css">

</head>

<body>

<div class="login-page">

    <div class="login-box">

        <div class="login-logo">
            🌸 <span>FreshFlower</span>
        </div>

        <h2>Buat Akun Baru</h2>

        <p class="login-subtitle">
            Daftar untuk mulai berbelanja bunga favoritmu.
        </p>

        <form>

            <div class="form-group">

                <label>Nama Lengkap</label>

                <input
                    type="text"
                    class="form-control"
                    placeholder="Masukkan nama lengkap"
                    required
                >

            </div>

            <div class="form-group">

                <label>Email</label>

                <input
                    type="email"
                    class="form-control"
                    placeholder="Masukkan email"
                    required
                >

            </div>

            <div class="form-group">

                <label>Password</label>

                <input
                    type="password"
                    class="form-control"
                    placeholder="Masukkan password"
                    required
                >

            </div>

            <div class="form-group">

                <label>Konfirmasi Password</label>

                <input
                    type="password"
                    class="form-control"
                    placeholder="Ulangi password"
                    required
                >

            </div>

            <button type="submit" class="btn-login">
                Daftar
            </button>

        </form>

        <p class="register-text">

            Sudah punya akun?

            <a href="login.html">
                Login
            </a>

        </p>

    </div>

</div>

</body>
</html>
