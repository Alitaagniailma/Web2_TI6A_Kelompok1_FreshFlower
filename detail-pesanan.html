<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Detail Pesanan - FreshFlower</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="assets/css/style.css">

</head>


<body>


<div class="container-fluid">

    <div class="row">


        <!-- =========================
             SIDEBAR USER
        ========================== -->

        <div class="sidebar">

            <div class="logo">
                FreshFlower
            </div>


            <ul>

                <li>
                    <a href="index.html">
                        <i class="bi bi-house-fill"></i>
                        Beranda
                    </a>
                </li>


                <li>
                    <a href="katalog.html">
                        <i class="bi bi-grid-fill"></i>
                        Katalog
                    </a>
                </li>


                <li>
                    <a href="keranjang.html">
                        <i class="bi bi-cart-fill"></i>
                        Keranjang
                    </a>
                </li>


                <li>
                    <a href="pesanan.html">
                        <i class="bi bi-box-fill"></i>
                        Pesanan
                    </a>
                </li>


                <li>
                    <a href="pelacakan.html">
                        <i class="bi bi-truck"></i>
                        Pelacakan
                    </a>
                </li>


                <li>
                    <a href="login.html">
                        <i class="bi bi-person-fill"></i>
                        Login
                    </a>
                </li>

            </ul>

        </div>



        <!-- =========================
             CONTENT
        ========================== -->

        <div class="content">


            <section class="detail-order-section">


                <h1>
                    Detail Pesanan 📦
                </h1>


                <p class="detail-order-subtitle">
                    Informasi lengkap mengenai pesanan kamu.
                </p>



                <!-- TEMPAT DETAIL PESANAN -->

                <div
                    class="detail-order-card"
                    id="detailOrderContainer"
                >

                    <!-- Data akan dibuat otomatis oleh JavaScript -->

                </div>


            </section>


        </div>

    </div>

</div>



<script>

/* =========================
   AMBIL PESANAN YANG DIPILIH
========================= */

const pesanan =
    JSON.parse(
        localStorage.getItem(
            'freshFlowerSelectedOrder'
        )
    );


/* =========================
   FORMAT RUPIAH
========================= */

function formatRupiah(angka) {

    return 'Rp' + angka.toLocaleString('id-ID');

}


/* =========================
   CONTAINER
========================= */

const container =
    document.getElementById(
        'detailOrderContainer'
    );



/* =========================
   CEK DATA PESANAN
========================= */

if (!pesanan) {


    container.innerHTML = `

        <div
            style="
                text-align:center;
                padding:40px;
            "
        >

            <i
                class="bi bi-exclamation-circle"
                style="
                    font-size:50px;
                    color:#88B18A;
                "
            ></i>


            <h2>
                Pesanan Tidak Ditemukan
            </h2>


            <p>
                Data pesanan yang ingin dilihat
                tidak tersedia.
            </p>


            <a
                href="pesanan.html"
                class="back-order-btn"
            >
                <i class="bi bi-arrow-left"></i>
                Kembali ke Pesanan
            </a>

        </div>

    `;


} else {


    /* =========================
       STATUS CLASS
    ========================= */

    let statusClass =
        'waiting';


    if (pesanan.status === 'Diproses') {

        statusClass =
            'process';

    }


    if (pesanan.status === 'Selesai') {

        statusClass =
            'done';

    }



    /* =========================
       PRODUK PESANAN
    ========================= */

    let produkHTML = '';


    pesanan.produk.forEach(product => {


        const totalProduk =
            product.price *
            product.quantity;


        produkHTML += `

            <div class="detail-product">


                <img
                    src="${product.image}"
                    alt="${product.name}"
                >


                <div class="detail-product-info">


                    <h3>
                        ${product.name}
                    </h3>


                    <p>
                        Jumlah:
                        ${product.quantity}
                    </p>


                    <p>
                        Harga satuan:
                        ${formatRupiah(product.price)}
                    </p>


                    <strong>
                        ${formatRupiah(totalProduk)}
                    </strong>


                </div>


            </div>

        `;

    });



    /* =========================
       PEMBAYARAN
    ========================= */

    let metodePembayaran =
        pesanan.pembayaran;


    if (metodePembayaran === 'transfer') {

        metodePembayaran =
            'Transfer Bank';

    }


    if (metodePembayaran === 'cod') {

        metodePembayaran =
            'COD';

    }



    /* =========================
       CATATAN
    ========================= */

    const catatan =
        pesanan.catatan &&
        pesanan.catatan.trim() !== ''
            ? pesanan.catatan
            : '-';



    /* =========================
       TAMPILKAN DETAIL
    ========================= */

    container.innerHTML = `


        <!-- =========================
             HEADER PESANAN
        ========================== -->

        <div class="detail-order-header">


            <div>

                <strong>
                    Pesanan #${pesanan.id}
                </strong>


                <small>
                    ${pesanan.tanggal}
                </small>

            </div>


            <span
                class="order-status ${statusClass}"
            >
                ${pesanan.status}
            </span>


        </div>



        <!-- =========================
             PRODUK
        ========================== -->

        <div class="detail-products">


            ${produkHTML}


        </div>



        <!-- =========================
             INFORMASI PENGIRIMAN
        ========================== -->

        <div class="detail-information">


            <h2>
                Informasi Pengiriman
            </h2>


            <p>

                <strong>
                    Nama:
                </strong>

                ${pesanan.nama}

            </p>


            <p>

                <strong>
                    No. Telepon:
                </strong>

                ${pesanan.telepon}

            </p>


            <p>

                <strong>
                    Alamat:
                </strong>

                ${pesanan.alamat}

            </p>


            <p>

                <strong>
                    Catatan:
                </strong>

                ${catatan}

            </p>


        </div>



        <!-- =========================
             INFORMASI PEMBAYARAN
        ========================== -->

        <div class="detail-information">


            <h2>
                Metode Pembayaran
            </h2>


            <p>

                <strong>
                    Metode:
                </strong>

                ${metodePembayaran}

            </p>


        </div>



        <!-- =========================
             RINGKASAN PEMBAYARAN
        ========================== -->

        <div class="detail-summary">


            <h2>
                Ringkasan Pembayaran
            </h2>


            <div class="detail-summary-row">


                <span>
                    Subtotal
                </span>


                <strong>
                    ${formatRupiah(pesanan.subtotal)}
                </strong>


            </div>


            <div class="detail-summary-row">


                <span>
                    Ongkos Kirim
                </span>


                <strong>
                    ${formatRupiah(pesanan.ongkir)}
                </strong>


            </div>


            <hr>


            <div
                class="detail-summary-row total"
            >


                <span>
                    Total
                </span>


                <strong>
                    ${formatRupiah(pesanan.total)}
                </strong>


            </div>


        </div>



        <!-- =========================
             BUTTON
        ========================== -->

        <div class="detail-actions">


            <a
                href="pesanan.html"
                class="back-order-btn"
            >

                <i class="bi bi-arrow-left"></i>

                Kembali ke Pesanan

            </a>


        </div>


    `;

}

</script>


</body>

</html>
