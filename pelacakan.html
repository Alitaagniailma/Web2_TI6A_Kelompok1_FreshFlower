<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pelacakan Pesanan - FreshFlower</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    >

    <!-- Google Font -->
    <link
        href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <!-- CSS -->
    <link rel="stylesheet" href="assets/css/style.css">

</head>


<body>

<div class="container-fluid">

    <div class="row">


        <!-- =========================
             SIDEBAR USER
        ========================== -->

        <div class="sidebar">

            <div class="logo">
                FreshFlower
            </div>

            <ul>

                <li>
                    <a href="index.html">
                        <i class="bi bi-house-fill"></i>
                        Beranda
                    </a>
                </li>

                <li>
                    <a href="katalog.html">
                        <i class="bi bi-grid-fill"></i>
                        Katalog
                    </a>
                </li>

                <li>
                    <a href="keranjang.html">
                        <i class="bi bi-cart-fill"></i>
                        Keranjang
                    </a>
                </li>

                <li>
                    <a href="pesanan.html">
                        <i class="bi bi-box-fill"></i>
                        Pesanan
                    </a>
                </li>

                <li>
                    <a href="pelacakan.html">
                        <i class="bi bi-truck"></i>
                        Pelacakan
                    </a>
                </li>

                <li>
                    <a href="login.html">
                        <i class="bi bi-person-fill"></i>
                        Login
                    </a>
                </li>

            </ul>

        </div>


        <!-- =========================
             CONTENT
        ========================== -->

        <div class="content">

            <section class="tracking-section">


                <!-- JUDUL -->

                <h1>
                    Pelacakan Pesanan 🚚
                </h1>

                <p class="tracking-subtitle">
                    Pantau status pesanan bunga kamu sampai selesai.
                </p>


                <!-- =========================
                     TEMPAT DATA PELACAKAN
                ========================== -->

                <div id="trackingContainer">

                    <!-- Diisi otomatis oleh JavaScript -->

                </div>


            </section>

        </div>

    </div>

</div>


<script>

/* =========================
   AMBIL PESANAN TERPILIH
========================= */

const pesanan =
    JSON.parse(
        localStorage.getItem(
            'freshFlowerSelectedOrder'
        )
    );


/* =========================
   FORMAT RUPIAH
========================= */

function formatRupiah(angka) {

    return 'Rp' +
        Number(angka).toLocaleString('id-ID');

}


/* =========================
   CONTAINER
========================= */

const trackingContainer =
    document.getElementById(
        'trackingContainer'
    );


/* =========================
   CEK PESANAN
========================= */

if (!pesanan) {

    trackingContainer.innerHTML = `

        <div class="tracking-card">

            <div
                style="
                    text-align:center;
                    padding:40px;
                "
            >

                <i
                    class="bi bi-box-seam"
                    style="
                        font-size:55px;
                        color:#88B18A;
                    "
                ></i>

                <h2>
                    Belum Ada Pesanan
                </h2>

                <p>
                    Silakan pilih pesanan terlebih dahulu
                    untuk melihat pelacakannya.
                </p>

                <a
                    href="pesanan.html"
                    class="tracking-btn"
                >
                    <i class="bi bi-box"></i>
                    Lihat Pesanan
                </a>

            </div>

        </div>

    `;

}


/* =========================
   JIKA PESANAN ADA
========================= */

else {


    /* =========================
       PRODUK
    ========================== */

    let produkHTML = '';


    pesanan.produk.forEach(product => {

        produkHTML += `

            <div class="tracking-product">

                <img
                    src="${product.image}"
                    alt="${product.name}"
                >

                <div>

                    <h3>
                        ${product.name}
                    </h3>

                    <p>
                        ${product.quantity}
                        ×
                        ${formatRupiah(product.price)}
                    </p>

                </div>

            </div>

        `;

    });


    /* =========================
       STATUS
    ========================== */

    const status =
        pesanan.status || 'Menunggu Pembayaran';


    /* =========================
       STATUS TAHAPAN
    ========================== */

    let tahap = 1;


    if (status === 'Diproses') {

        tahap = 2;

    }


    if (
        status === 'Dikirim' ||
        status === 'Dalam Perjalanan'
    ) {

        tahap = 3;

    }


    if (status === 'Selesai') {

        tahap = 4;

    }


    /* =========================
       BUAT TAMPILAN
    ========================== */

    trackingContainer.innerHTML = `

        <!-- =========================
             INFORMASI PESANAN
        ========================== -->

        <div class="tracking-card">


            <div class="tracking-header">

                <div>

                    <strong>
                        Nomor Pesanan
                    </strong>

                    <h2>
                        #${pesanan.id}
                    </h2>

                </div>


                <span
                    class="order-status ${
                        status === 'Selesai'
                            ? 'done'
                            : status === 'Diproses'
                            ? 'process'
                            : 'waiting'
                    }"
                >
                    ${status}
                </span>

            </div>


            <!-- =========================
                 PRODUK PESANAN
            ========================== -->

            <div class="tracking-products">

                <h2>
                    Produk Pesanan
                </h2>

                ${produkHTML}

            </div>


            <!-- =========================
                 TOTAL
            ========================== -->

            <div class="tracking-total">

                <span>
                    Total Pesanan
                </span>

                <strong>
                    ${formatRupiah(pesanan.total)}
                </strong>

            </div>


            <!-- =========================
                 STATUS PESANAN
            ========================== -->

            <div class="tracking-status">

                <h2>
                    Status Pesanan
                </h2>


                <!-- TAHAP 1 -->

                <div
                    class="tracking-step ${
                        tahap >= 1 ? 'active' : ''
                    }"
                >

                    <div class="step-icon">

                        <i class="bi bi-check-circle-fill"></i>

                    </div>

                    <div>

                        <h3>
                            Pesanan Dibuat
                        </h3>

                        <p>
                            Pesanan berhasil dibuat.
                        </p>

                    </div>

                </div>


                <!-- TAHAP 2 -->

                <div
                    class="tracking-step ${
                        tahap >= 2 ? 'active' : ''
                    }"
                >

                    <div class="step-icon">

                        <i class="bi bi-box-seam"></i>

                    </div>

                    <div>

                        <h3>
                            Pesanan Diproses
                        </h3>

                        <p>
                            Pesanan sedang dipersiapkan.
                        </p>

                    </div>

                </div>


                <!-- TAHAP 3 -->

                <div
                    class="tracking-step ${
                        tahap >= 3 ? 'active' : ''
                    }"
                >

                    <div class="step-icon">

                        <i class="bi bi-truck"></i>

                    </div>

                    <div>

                        <h3>
                            Pesanan Dikirim
                        </h3>

                        <p>
                            Pesanan sedang dalam perjalanan.
                        </p>

                    </div>

                </div>


                <!-- TAHAP 4 -->

                <div
                    class="tracking-step ${
                        tahap >= 4 ? 'active' : ''
                    }"
                >

                    <div class="step-icon">

                        <i class="bi bi-house-check-fill"></i>

                    </div>

                    <div>

                        <h3>
                            Pesanan Selesai
                        </h3>

                        <p>
                            Pesanan telah diterima.
                        </p>

                    </div>

                </div>

            </div>


            <!-- =========================
                 INFORMASI PENGIRIMAN
            ========================== -->

            <div class="tracking-information">

                <h2>
                    Informasi Pengiriman
                </h2>


                <p>

                    <strong>
                        Nama Penerima:
                    </strong>

                    ${pesanan.nama}

                </p>


                <p>

                    <strong>
                        Nomor Telepon:
                    </strong>

                    ${pesanan.telepon}

                </p>


                <p>

                    <strong>
                        Alamat:
                    </strong>

                    ${pesanan.alamat}

                </p>


                <p>

                    <strong>
                        Metode Pembayaran:
                    </strong>

                    ${
                        pesanan.pembayaran === 'transfer'
                            ? 'Transfer Bank'
                            : 'COD'
                    }

                </p>


                ${
                    pesanan.catatan
                    ? `
                        <p>

                            <strong>
                                Catatan:
                            </strong>

                            ${pesanan.catatan}

                        </p>
                    `
                    : ''
                }

            </div>


            <!-- =========================
                 BUTTON
            ========================== -->

            <div class="tracking-actions">

                <a
                    href="pesanan.html"
                    class="tracking-btn"
                >

                    <i class="bi bi-arrow-left"></i>

                    Kembali ke Pesanan

                </a>


                <a
                    href="katalog.html"
                    class="tracking-btn secondary"
                >

                    <i class="bi bi-bag-heart"></i>

                    Belanja Lagi

                </a>

            </div>


        </div>

    `;

}

</script>


</body>

</html>
